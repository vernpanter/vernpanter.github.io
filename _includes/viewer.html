<dialog class="viewer" id="viewer" aria-label="Artwork viewer">
  <div class="viewer-stage"><img alt=""></div>
  <div class="viewer-bar">
    <div class="viewer-label" aria-live="polite">
      <p><cite></cite><span class="viewer-year"></span></p>
      <p class="quiet viewer-detail"></p>
      <p class="quiet viewer-description"></p>
    </div>
    <div class="viewer-buttons">
      <button type="button" data-go="-1" aria-label="Previous image">&larr;</button>
      <button type="button" data-go="1" aria-label="Next image">&rarr;</button>
      <button type="button" data-close>Close</button>
    </div>
  </div>
</dialog>
<script src="/assets/site.js" defer></script>
